<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telugu JARVIS AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050b14;
  color: #00eaff;
  font-family: Arial, sans-serif;
  text-align: center;
  min-height: 100vh;
  padding: 25px 15px;
}

h1 {
  margin-top: 20px;
  letter-spacing: 4px;
  text-shadow: 0 0 15px #00eaff;
}

.arc {
  width: 150px;
  height: 150px;
  border: 5px solid #00eaff;
  border-radius: 50%;
  margin: 35px auto;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 28px;
  box-shadow: 0 0 30px #00eaff;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { box-shadow: 0 0 10px #00eaff; }
  to { box-shadow: 0 0 35px #0088ff; }
}

p {
  color: #d8faff;
}

input {
  width: 90%;
  max-width: 450px;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #00eaff;
  background: #101a29;
  color: white;
  font-size: 16px;
  margin: 10px 0;
}

button {
  padding: 13px 20px;
  margin: 6px;
  border: 1px solid #00eaff;
  border-radius: 10px;
  background: #062b40;
  color: #00eaff;
  font-size: 16px;
}

button:active {
  background: #005577;
}

#reply {
  margin: 25px auto;
  max-width: 450px;
  padding: 18px;
  border: 1px solid #00eaff;
  border-radius: 12px;
  color: white;
  line-height: 1.7;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<h1>J.A.R.V.I.S</h1>
<p>PERSONAL TELUGU AI ASSISTANT</p>

<div class="arc">JARVIS</div>

<p id="status">నమస్కారం! నేను మీ JARVIS.</p>

<input id="question"
       type="text"
       placeholder="మీ ప్రశ్నను తెలుగులో టైప్ చేయండి">

<br>

<button onclick="askJarvis()">ప్రశ్న అడుగు</button>
<button onclick="listen()">🎙️ మాట్లాడు</button>
<button onclick="speakReply()">🔊 మళ్లీ విను</button>

<div id="reply">
  మీకు నేను ఎలా సహాయం చేయగలను?
</div>

<script>
let lastReply = "నమస్కారం! నేను మీ JARVIS అసిస్టెంట్.";

function askJarvis() {
  const q = document.getElementById("question").value.trim();
  const reply = document.getElementById("reply");
  const status = document.getElementById("status");

  if (!q) {
    reply.textContent = "దయచేసి మీ ప్రశ్నను టైప్ చేయండి లేదా మాట్లాడండి.";
    return;
  }

  const text = q.toLowerCase();

  if (text.includes("నీ పేరు") || text.includes("నీ పేరేంటి")) {
    lastReply = "నా పేరు JARVIS. నేను మీ తెలుగు AI అసిస్టెంట్.";
  } else if (text.includes("హలో") || text.includes("నమస్కారం")) {
    lastReply = "నమస్కారం! మీరు ఎలా ఉన్నారు?";
  } else if (text.includes("బ్యాటరీ")) {
    lastReply = "బ్యాటరీ వివరాలు తెలుసుకోవడానికి మీ ఫోన్ బ్రౌజర్ అనుమతులు, మద్దతు అవసరం.";
  } else if (text.includes("ఎలా ఉన్నావు")) {
    lastReply = "నేను బాగున్నాను! మీకు ఎలా సహాయం చేయాలి?";
  } else if (text.includes("సమయం")) {
    lastReply = "మీ ఫోన్‌లో ప్రస్తుత సమయం " +
      new Date().toLocaleTimeString("te-IN");
  } else {
    lastReply = "మీ ప్రశ్నను స్వీకరించాను. నిజమైన AI సమాధానాల కోసం తర్వాత AI API అనుసంధానం చేద్దాం.";
  }

  reply.textContent = lastReply;
  status.textContent = "JARVIS సిద్ధంగా ఉంది";
  speakReply();
}

function speakReply() {
  if (!("speechSynthesis" in window)) {
    document.getElementById("status").textContent =
      "మీ బ్రౌజర్‌లో వాయిస్ సదుపాయం అందుబాటులో లేదు.";
    return;
  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(lastReply);
  speech.lang = "te-IN";
  speech.rate = 0.9;

  const voices = window.speechSynthesis.getVoices();
  const teluguVoice = voices.find(v =>
    v.lang.toLowerCase().startsWith("te")
  );

  if (teluguVoice) {
    speech.voice = teluguVoice;
  }

  window.speechSynthesis.speak(speech);
}

function listen() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    document.getElementById("status").textContent =
      "ఈ బ్రౌజర్‌లో వాయిస్ గుర్తింపు అందుబాటులో లేదు. Chromeలో ప్రయత్నించండి.";
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "te-IN";
  recognition.interimResults = false;

  document.getElementById("status").textContent =
    "వింటున్నాను... ఇప్పుడు మాట్లాడండి.";

  recognition.onresult = function(event) {
    document.getElementById("question").value =
      event.results[0][0].transcript;
    askJarvis();
  };

  recognition.onerror = function() {
    document.getElementById("status").textContent =
      "వాయిస్ గుర్తించలేకపోయాను. మళ్లీ ప్రయత్నించండి.";
  };

  recognition.start();
}
</script>

</body>
</html>
